name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore: [ "**.md" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CineLocal APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Garantir que a pasta data/ foi versionada
        run: |
          test -d app/src/main/java/com/example/cinelocal/data || {
            echo "::error::Pasta data/ ausente. Verifique o .gitignore (nao pode ter a linha 'data')."
            exit 1
          }

      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cinelocal.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/cinelocal.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem KEYSTORE_BASE64: assinando com chave de debug padrao."
          fi

      - name: Guard - funcionalidades essenciais
        run: |
          fail=0
          check() { # $1=padrão  $2=arquivo  $3=descrição
            if ! grep -q -- "$1" "$2"; then
              echo "::error::Funcionalidade removida: $3 (esperado '$1' em $2)"
              fail=1
            fi
          }
          B=app/src/main/java/com/example/cinelocal
          check "OpenMultipleDocuments"      $B/MainActivity.kt                  "seleção de vídeo(s) solto(s)"
          check "OpenDocumentTree"           $B/MainActivity.kt                  "seleção de pasta"
          check "Selecionar Vídeo(s)"        $B/ui/components/AddMediaDialog.kt  "botão Selecionar Vídeo(s)"
          check "addStandaloneVideoFiles"    $B/data/repository/MediaRepository.kt "gravação de vídeos soltos"
          check "softWrap = false"           $B/MainActivity.kt                  "rótulo da barra em uma linha"
          exit $fail

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Nomear APK
        run: |
          mkdir -p dist apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/CineLocal-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/CineLocal-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/CineLocal.apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/CineLocal-v1.5.0.apk
          ls -la dist/
          ls -la apk/

      - name: Conferir assinatura e versao
        continue-on-error: true
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs dist/CineLocal-debug.apk | head -3
          "$BT/aapt2" dump badging dist/CineLocal-debug.apk | head -1

      - name: Subir artifact (todas as execucoes, inclusive PR)
        uses: actions/upload-artifact@v4
        with:
          name: CineLocal-APK
          path: dist/CineLocal-debug.apk
          retention-days: 30

      - name: Publicar Release "latest"
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHORT=${GITHUB_SHA::7}
          SUM=$(sha256sum dist/CineLocal-debug.apk | cut -d' ' -f1)

          cat > dist/notes.md <<EOF
          Build automatica CineLocal.

          - **Versao**: $VERSION
          - **Build**: #$GITHUB_RUN_NUMBER
          - **Commit**: $SHORT
          - **SHA-256 do APK**: \`$SUM\`

          ### Como instalar:
          1. Baixe o arquivo **CineLocal-debug.apk** abaixo.
          2. Abra o arquivo no Android e autorize a instalacao de fontes desconhecidas se solicitado.
          EOF

          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/CineLocal-debug.apk \
            --target "$GITHUB_SHA" \
            --title "CineLocal $VERSION (build #$GITHUB_RUN_NUMBER)" \
            --notes-file dist/notes.md \
            --latest
